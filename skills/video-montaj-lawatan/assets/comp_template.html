// ---------- maths ----------
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=t=>1-Math.pow(1-t,3), eIn=t=>t*t*t, eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const eSine=t=>-(Math.cos(Math.PI*t)-1)/2;
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}

const PH={},BG={};let LOGO;

function loadImg(src){return new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=src})}
let GRAIN;
async function boot(){
  await Promise.all(NAMES.map(async n=>{PH[n]=await loadImg('ph/'+n+'.jpg');BG[n]=await loadImg('bg/'+n+'.jpg')}));

  // film grain tile
  GRAIN=document.createElement('canvas');GRAIN.width=540;GRAIN.height=960;
  const g=GRAIN.getContext('2d'),id=g.createImageData(540,960),R=rng(7);
  for(let i=0;i<id.data.length;i+=4){const v=R()*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}
  g.putImageData(id,0,0);
  buildTimeline();
  window.READY=true;
}

// ---------- drawing helpers ----------
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath()}
function cover(img,dx,dy,dw,dh,zoom=1,px=.5,py=.5){
  const ir=img.width/img.height,dr=dw/dh;let sw,sh;
  if(ir>dr){sh=img.height;sw=sh*dr}else{sw=img.width;sh=sw/dr}
  sw/=zoom;sh/=zoom;X.drawImage(img,(img.width-sw)*px,(img.height-sh)*py,sw,sh,dx,dy,dw,dh);
}
function txt(s,x,y,font,fill,opts={}){
  X.save();X.font=font;X.textAlign=opts.align||'center';X.textBaseline=opts.base||'middle';
  if(opts.ls)X.letterSpacing=opts.ls+'px';
  if(opts.shadow){X.shadowColor=opts.shadow;X.shadowBlur=opts.sb??18;X.shadowOffsetY=opts.sy??4}
  if(opts.stroke){X.lineJoin='round';X.lineWidth=opts.sw||10;X.strokeStyle=opts.stroke;X.strokeText(s,x,y);X.shadowColor='transparent'}
  X.fillStyle=fill;X.fillText(s,x,y);X.restore();
}
function grain(t){X.save();X.globalAlpha=.045;X.globalCompositeOperation='overlay';const f=Math.floor(t*FPS);const R=rng(f+11);X.drawImage(GRAIN,-R()*200,-R()*300,W+400,H+600);X.restore()}
function vignette(a=.55){const g=X.createRadialGradient(W/2,H/2,H*.28,W/2,H/2,H*.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${a})`);X.fillStyle=g;X.fillRect(0,0,W,H)}
function bokeh(t,n=26,col='255,214,120',seed=3,a=.16){const R=rng(seed);X.save();X.globalCompositeOperation='screen';
  for(let i=0;i<n;i++){const x0=R()*W,y0=R()*H,r=14+R()*46,sp=8+R()*22,ph=R()*6.28;
    const x=(x0+Math.sin(t*.3+ph)*40)%W,y=((y0-t*sp)%H+H)%H;const al=a*(.5+.5*Math.sin(t*.8+ph));
    const g=X.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${col},${al})`);g.addColorStop(1,`rgba(${col},0)`);X.fillStyle=g;X.fillRect(x-r,y-r,2*r,2*r)}
  X.restore()}
function lightLeak(t,a=.22){X.save();X.globalCompositeOperation='screen';
  const x=W*(.15+.7*(.5+.5*Math.sin(t*.23))),y=H*(.2+.15*Math.sin(t*.17));
  const g=X.createRadialGradient(x,y,0,x,y,700);g.addColorStop(0,`rgba(255,170,80,${a})`);g.addColorStop(.5,`rgba(255,120,60,${a*.35})`);g.addColorStop(1,'rgba(255,120,60,0)');X.fillStyle=g;X.fillRect(0,0,W,H);X.restore()}
function rays(cx,cy,t,col='255,201,60',a=.16,n=14,len=1400){X.save();X.translate(cx,cy);X.rotate(t*.25);X.globalCompositeOperation='screen';
  for(let i=0;i<n;i++){X.rotate(Math.PI*2/n);const g=X.createLinearGradient(0,0,len,0);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(1,`rgba(${col},0)`);X.fillStyle=g;X.beginPath();X.moveTo(0,0);X.lineTo(len,-len*.09);X.lineTo(len,len*.09);X.closePath();X.fill()}
  X.restore()}
function emoji(e,x,y,size){X.save();X.font=`${size}px ${EMO}`;X.textAlign='center';X.textBaseline='middle';X.fillText(e,x,y);X.restore()}

// ---------- timeline ----------
const P=n=>n; // photo ref
const LEVELS=[
 {chip:'LEVEL 1',stamp:'LEVEL 1',title:'Naik Bas!',col:TEAL,photos:['01_bas_lelaki_gaya','02_bas_perempuan_penuh','03_bas_lelaki_bantal'],z:[1,0,1],
  caps:['Pagi-pagi dah bersemangat!','Semua dah naik? Jom gerak!','Bantal leher siap sedia 😴'],badge:['🚌','Penumpang Ceria']},
 {chip:'LEVEL 2',stamp:'LEVEL 2',title:'Tiba di George Town',col:TEAL,photos:['04_tiba_komtar','04b_komtar_selfie_guru_lelaki'],z:[0,1],
  caps:['Sampai di KOMTAR, Pulau Pinang!','Cikgu pun tak sabar 🤳'],badge:['📍','Sampai Penang']},
 {chip:'LEVEL 3 · THE TOP',stamp:'LEVEL 3',title:'Daftar Masuk',col:CORAL,photos:['05_thetop_skrin_lobi','05c_thetop_lobi_gaya_ceria','06_thetop_gelang_kumpulan','07_thetop_selfie_guru'],z:[1,0,1,0],
  caps:['Nama sekolah kita di skrin gergasi!','Bergaya dulu sebelum masuk ✌️','Gelang pas masuk: AKTIF!','Satu pasukan, satu misi'],badge:['🎟️','Pas Masuk']},
 {chip:'LEVEL 3 · THE TOP',stamp:'SUB-MISI',title:'Dunia Jurassic',col:CORAL,photos:['06c_jurassic_pintu_masuk','06b_thetop_teater_gelap','06d_dinosaur_kumpulan','06e_dinosaur_sangkar_lelaki'],z:[1,1,0,1],
  caps:['Berani masuk tak?','Mata tak berkelip langsung...','Jumpa dinosaur gergasi! 🦖','Rawrr! Jangan dekat sangat'],badge:['🦖','Penjelajah Dinosaur']},
 {chip:'LEVEL 3 · THE TOP',stamp:'SUB-MISI',title:'Bawah Laut',col:CORAL,photos:['06f_akuarium_kubah_dua_lelaki','06g_akuarium_kubah_kopiah','06h_akuarium_kubah_perempuan','06i_akuarium_rumah_kampung_perempuan'],z:[0,1,0,1],
  caps:['Kapal selam mini di Top Boutique Aquarium 🐠','Hai, ikan-ikan!','Siapa tengok siapa ni?','Rumah tepi laut, comelnya'],badge:['🐠','Peneroka Laut']},
 {chip:'LEVEL BOS',stamp:'LEVEL BOS',title:'Puncak 249 Meter',col:'#ff4d3d',boss:true,photos:['08_pemandangan_georgetown','09_thetop_tingkap_pandang','09e_skywalk_perempuan_cikgu','09f_skywalk_perempuan_menegak','09g_skywalk_lelaki','09b_lantai_kaca_lelaki','09c_lantai_kaca_atas','09d_lantai_kaca_perempuan'],z:[0,1,0,1,0,1,0,1],
  caps:['Pulau Pinang dari atas awan','Wah... tingginya!','Rainbow Skywalk, tingkat 68 ✨','Bergaya di atas langit','Geng skywalk!','Lantai kaca... berani tak? 😱','Bandar di bawah kaki!','BERANI! ✌️'],badge:['🏆','Hero Langit']},
 {chip:'LEVEL 3 · THE TOP',stamp:'SUB-MISI',title:'Taman Atas Awan',col:CORAL,photos:['10_thetop_bumbung_kerusi_menegak','10b_taman_bumbung_kerusi_tuah'],z:[0,1],
  caps:['Rehat atas rumput hijau','Kerusi paling bertuah di dunia! 🍀'],badge:['🍀','Kerusi Tuah']},
 {chip:'LEVEL 3 · THE TOP',stamp:'SUB-MISI',title:'Isi Tenaga',col:CORAL,collage:['11a_makan_tgh_meja_lelaki1','11b_makan_tgh_meja_lelaki2','11d_makan_tgh_meja_perempuan1','11c_makan_tgh_meja_lelaki3','11e_makan_tgh_meja_perempuan2_menegak'],
  caps:['+100 Tenaga! Makan tengah hari 🍗'],badge:['🍗','Perut Kenyang']},
 {chip:'LEVEL 4',stamp:'LEVEL 4',title:'Masjid Abdullah Fahim',col:GREEN,calm:true,photos:['15_masjid_solat_perempuan','16_masjid_makan_malam_lelaki1','16b_masjid_makan_malam_lelaki2'],z:[1,0,1],collage3:['14_makan_lantai_kumpulan1','14_makan_lantai_kumpulan2','14_makan_lantai_kumpulan3'],
  caps:['Praktikal solat jamak Maghrib & Isyak 🤲','Makan malam bersila, nikmatnya!','Geng lelaki pun lapar 😋','Makan bersama, kenyang bersama'],badge:['🕌','Hati Tenang']},
];
const SLIDE=2.5, XF=.55, STAMP=1.45, AWARD=1.5;
let TL=[],TOTAL=0,CUES=[];
function buildTimeline(){
  let t=0;const add=(o)=>{o.s=t;o.e=t+o.d;TL.push(o);t+=o.d};
  add({k:'intro',d:6.2});
  LEVELS.forEach((L,li)=>{
    if(li===1)add({k:'map',d:7.2,m:0});
    if(li===8)add({k:'map',d:4.2,m:1});
    if(BUS[li])add({k:'bus',d:2.6,...BUS[li],li});
    const slides=[];
    (L.photos||[]).forEach((p,i)=>slides.push({p,z:L.z[i],cap:L.caps[i],d:SLIDE+(L.boss&&i===0?1.4:0)+(i===0?.6:0)}));
    if(L.collage)slides.push({collage:L.collage,cap:L.caps[0],d:5.4});
    if(L.collage3)slides.push({collage3:L.collage3,cap:L.caps[L.caps.length-1],d:4.6});
    slides[slides.length-1].d+=AWARD-.6;
    let lt=0;slides.forEach(s=>{s.s=lt;s.e=lt+s.d;lt+=s.d});
    add({k:'level',d:lt,L,li,slides});
  });
  add({k:'map',d:5.4,m:2});
  add({k:'done',d:6.8});
  add({k:'end',d:5.2});
  add({k:'thanks',d:6.6});
  TOTAL=t;
  // sound cues
  const q=(tt,type)=>CUES.push({t:+tt.toFixed(3),type});
  TL.forEach(sc=>{
    if(sc.k==='intro'){q(.5,'shimmer');q(2.25,'ding');q(3.7,'whoosh');q(3.95,'pop');q(5.25,'click');q(5.7,'whoosh')}
    if(sc.k==='map'){q(sc.s+.9,'horn')}
    if(sc.k==='bus'){q(sc.s,'engine_'+sc.d);q(sc.s+.55,'horn')}
    if(sc.k==='level'){q(sc.s,sc.L.boss?'boss':'stamp');q(sc.e-AWARD+.05,'badge');if(sc.L.calm)q(sc.s,'calm_on');if(sc.li===7)q(sc.e,'calm_pre')}
    if(sc.k==='done'){q(sc.s,'fanfare');[1.6,2.1,2.6,3.1].forEach(d=>q(sc.s+d,'pop'))}
    if(sc.k==='end'){q(sc.s,'end_on');q(sc.s+.2,'shimmer')}
    if(sc.k==='thanks'){q(sc.s,'ding')}
  });
  window.TOTAL=TOTAL;window.CUES=CUES;window.TLINFO=TL.map(s=>({k:s.k,s:s.s,e:s.e,title:s.L?s.L.title:''}));
}

// ---------- photo card ----------
const ZT=440,ZB=1395,ZW=1000;
function cardRect(img){
  const ar=img.width/img.height,da=clamp(ar,.72,1.45),zh=ZB-ZT;let w,h;
  if(da>=ZW/zh){w=ZW;h=ZW/da}else{h=zh;w=zh*da}
  return {x:(W-w)/2,y:ZT+(zh-h)/2,w,h,ar,da};
}
function drawCard(name,u,zin,alpha=1,scl=1,shake=0){
  const img=PH[name],r=cardRect(img);
  X.save();X.globalAlpha=alpha;
  const cx=r.x+r.w/2,cy=r.y+r.h/2;X.translate(cx+shake*Math.sin(u*90),cy+shake*Math.cos(u*77));X.scale(scl,scl);X.translate(-cx,-cy);
  X.shadowColor='rgba(0,0,0,.55)';X.shadowBlur=70;X.shadowOffsetY=24;rr(r.x,r.y,r.w,r.h,34);X.fillStyle='#000';X.fill();X.shadowColor='transparent';
  X.save();rr(r.x,r.y,r.w,r.h,34);X.clip();
  const z=zin?lerp(1.0,1.1,eSine(u)):lerp(1.1,1.0,eSine(u));
  let px=.5,py=.5;
  if(r.ar>r.da+.01)px=lerp(.18,.82,eSine(u));
  else if(r.ar<r.da-.01)py=lerp(.22,.6,eSine(u));
  cover(img,r.x,r.y,r.w,r.h,z,px,py);
  // subtle top sheen
  const g=X.createLinearGradient(r.x,r.y,r.x+r.w,r.y+r.h);g.addColorStop(0,'rgba(255,255,255,.08)');g.addColorStop(.4,'rgba(255,255,255,0)');X.fillStyle=g;X.fillRect(r.x,r.y,r.w,r.h);
  X.restore();
  rr(r.x,r.y,r.w,r.h,34);X.lineWidth=7;X.strokeStyle='rgba(255,255,255,.92)';X.stroke();
  X.restore();return r;
}
function drawBG(name,alpha=1,tint){
  X.save();X.globalAlpha=alpha;cover(BG[name],0,0,W,H,1.08);X.restore();
}
function sceneBase(tint){
  const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(8,18,40,.78)');g.addColorStop(.24,'rgba(8,18,40,.25)');g.addColorStop(.7,'rgba(8,18,40,.25)');g.addColorStop(1,'rgba(8,18,40,.86)');X.fillStyle=g;X.fillRect(0,0,W,H);
  if(tint){X.save();X.globalAlpha=.16;X.fillStyle=tint;X.globalCompositeOperation='soft-light';X.fillRect(0,0,W,H);X.restore()}
}

// ---------- HUD ----------
function hudTop(L,a,tIn){
  X.save();X.globalAlpha=a;
  // brand row
  X.save();X.beginPath();X.arc(W/2-232,128,30,0,7);X.clip();X.drawImage(LOGO,W/2-262,98,60,60);X.restore();
  txt('MISI PENJELAJAH CILIK',W/2+22,130,`800 28px Nunito`,'rgba(255,255,255,.9)',{ls:5});
  // chip
  const ci=eBack(seg(tIn,0,.45));X.save();X.translate(W/2,212);X.scale(ci,ci);
  X.font='800 34px "Baloo 2"';X.letterSpacing='3px';const cw=X.measureText(L.chip).width+64;
  rr(-cw/2,-30,cw,62,31);X.fillStyle=L.col;X.shadowColor='rgba(0,0,0,.35)';X.shadowBlur=14;X.shadowOffsetY=5;X.fill();X.restore();
  txt(L.chip,W/2,215,'800 34px "Baloo 2"','#fff',{ls:3});
  const ti=eOut(seg(tIn,.1,.6));
  X.globalAlpha=a*ti;
  const fs=L.title.length>16?82:96;
  txt(L.title,W/2,322+(1-ti)*40,`800 ${fs}px "Baloo 2"`,'#fff',{shadow:'rgba(0,0,0,.6)',sb:24,sy:6,stroke:'rgba(10,24,48,.55)',sw:12});
  X.restore();
}
function caption(s,a,dy=0){if(!s||a<=0)return;X.save();X.globalAlpha=a;X.font='900 46px Nunito,"Noto Color Emoji"';const w=Math.min(X.measureText(s).width+80,1000);
  rr((W-w)/2,1430+dy,w,84,42);X.fillStyle='rgba(8,18,40,.62)';X.fill();X.lineWidth=2;X.strokeStyle='rgba(255,201,60,.55)';X.stroke();X.restore();
  txt(s,W/2,1474+dy,'900 46px Nunito,"Noto Color Emoji"','#fff',{});X.globalAlpha=1}
const SLOT_Y=1580,SLOT_R=33;
function slotX(i){return W/2+(i-4)*80}
function tray(earned,a=1,glowAll=0,t=0){
  X.save();X.globalAlpha=a;
  for(let i=0;i<9;i++){const x=slotX(i);
    if(i<earned){medal(x,SLOT_Y,SLOT_R,LEVELS[i].badge[0],glowAll?(.5+.5*Math.sin(t*6+i)):0)}
    else{X.beginPath();X.arc(x,SLOT_Y,SLOT_R,0,7);X.fillStyle='rgba(8,18,40,.45)';X.fill();X.setLineDash([6,6]);X.lineWidth=3;X.strokeStyle='rgba(255,255,255,.4)';X.stroke();X.setLineDash([]);
      txt('?',x,SLOT_Y+2,'800 30px "Baloo 2"','rgba(255,255,255,.4)')}}
  X.restore();
}
function medal(x,y,r,e,glow=0){
  X.save();
  if(glow>0){X.shadowColor=`rgba(255,201,60,${.9*glow})`;X.shadowBlur=30}
  const g=X.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r);g.addColorStop(0,'#fff3b0');g.addColorStop(.45,GOLD);g.addColorStop(1,GOLD2);
  X.beginPath();X.arc(x,y,r,0,7);X.fillStyle=g;X.fill();X.shadowColor='transparent';
  X.lineWidth=Math.max(3,r*.09);X.strokeStyle='#fff';X.stroke();
  X.beginPath();X.arc(x,y,r*.78,0,7);X.lineWidth=Math.max(1.5,r*.04);X.strokeStyle='rgba(180,100,0,.45)';X.stroke();
  emoji(e,x,y+r*.05,r*1.0);X.restore();
}
function xpBar(p,a=1,label){
  X.save();X.globalAlpha=a;const w=640,x=(W-w)/2,y=1648;
  txt('XP',x-38,y+13,'800 30px "Baloo 2"',GOLD);
  rr(x,y,w,26,13);X.fillStyle='rgba(8,18,40,.6)';X.fill();X.lineWidth=2;X.strokeStyle='rgba(255,255,255,.35)';X.stroke();
  if(p>0){X.save();rr(x,y,w,26,13);X.clip();const g=X.createLinearGradient(x,0,x+w,0);g.addColorStop(0,TEAL);g.addColorStop(.6,GOLD);g.addColorStop(1,CORAL);X.fillStyle=g;X.fillRect(x,y,w*p,26);
    X.fillStyle='rgba(255,255,255,.35)';X.fillRect(x,y+3,w*p,6);X.restore()}
  txt(label||Math.round(p*100)+'%',x+w+50,y+14,'800 28px "Baloo 2"','#fff');
  X.restore();
}
function stamp(L,u,t){ // u: 0..1 over STAMP
  const a=u<.78?1:1-seg(u,.78,1);
  X.save();X.globalAlpha=a*.6;X.fillStyle='#050b18';X.fillRect(0,0,W,H);X.restore();
